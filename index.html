<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jamjoom Pharma Ophthalmology Portal</title>
<style>
:root{--navy:#1F3864;--orange:#ED7D31;--bg:#F5F7FA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;display:flex;align-items:stretch;gap:18px;padding:0 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;justify-content:center;padding:10px 0;min-width:0}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:11.5px;opacity:.75}
nav{display:flex;gap:2px;margin-left:auto;align-items:flex-end;overflow-x:auto}
nav button{appearance:none;border:0;background:transparent;color:#cdd6ea;font:600 13.5px/1 inherit;font-family:inherit;padding:14px 16px 13px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--orange)}
nav button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
@media (max-width:640px){
  header{gap:0;padding:0 8px}
  .brand{width:100%;padding:8px 4px 2px}
  nav{margin-left:0;width:100%}
  nav button{padding:11px 10px 10px;font-size:12.5px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Jamjoom Pharma · Ophthalmology</b><span id="sub">JP Ophtha Sales</span></div>
  <nav role="tablist" aria-label="Dashboards">
    <button role="tab" id="t-sales" data-tab="sales" aria-selected="true">JP Ophtha Sales</button>
    <button role="tab" id="t-chain" data-tab="chain" aria-selected="false">Chain Sell-Out</button>
    <button role="tab" id="t-direct" data-tab="direct" aria-selected="false">Direct Customers Sell-Out</button>
  </nav>
</header>
<main>
  <iframe id="f-sales" title="JP Ophtha Sales" data-src="sales.html"></iframe>
  <iframe id="f-chain" title="Chain Sell-Out Dashboard" data-src="chain.html"></iframe>
  <iframe id="f-direct" title="JP Direct Customers Sell-Out Dashboard" data-src="direct.html"></iframe>
</main>
<script>
const tabs=[...document.querySelectorAll('nav button')];
function show(name){
  if(!document.getElementById('f-'+name)) name='sales';
  tabs.forEach(b=>{const on=b.dataset.tab===name;b.setAttribute('aria-selected',on);if(on)document.getElementById('sub').textContent=b.textContent;});
  document.querySelectorAll('iframe').forEach(f=>{
    const on=f.id==='f-'+name;
    if(on&&!f.src) f.src=f.dataset.src; // load each dashboard the first time its tab opens
    f.classList.toggle('on',on);
  });
  if(location.hash.slice(1)!==name) history.replaceState(null,'','#'+name);
}
tabs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
document.querySelector('nav').addEventListener('keydown',e=>{
  const i=tabs.findIndex(b=>b.getAttribute('aria-selected')==='true');
  const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
  if(d){const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.tab)}
});
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'sales');
</script>
</body>
</html>
